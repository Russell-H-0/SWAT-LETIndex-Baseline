[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swat-letindex-baseline"
version = "0.1.0"
description = "SWAT-M-Block: block-granular SWAT-style merge baseline over the LETIndex substrate (M0 bootstrap)."
readme = ""
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
